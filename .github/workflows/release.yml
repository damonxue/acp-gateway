name: Release desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Build and package DMG
        run: bash script/bundle-mac.sh --no-web
      - uses: actions/upload-artifact@v4
        with:
          name: agent-gateway-macos
          path: target/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Build gateway daemon
        run: cargo build --release --locked -p gateway-cli
      - name: Build Windows desktop app
        run: cargo build --release --locked --manifest-path app/Cargo.toml
      - name: Package Windows app
        shell: pwsh
        run: ./script/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-gateway-windows
          path: target/*windows-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.run_number }}
          name: Agent Gateway main build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
