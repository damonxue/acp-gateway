[package]
name = "gateway-cli"
description = "Command line entry point for Agent Gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Serve the built web client at `/app`. Requires `cd web && pnpm build` first;
# `script/bundle-mac.sh` does both.
web-ui = ["gateway-remote/web-ui"]

[[bin]]
name = "agent-gateway"
path = "src/main.rs"

[dependencies]
gateway-ahp.workspace = true
gateway-acp.workspace = true
gateway-auth.workspace = true
gateway-config.workspace = true
gateway-core.workspace = true
gateway-relay.workspace = true
gateway-remote.workspace = true
gateway-store.workspace = true
gateway-tunnel.workspace = true

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
hostname.workspace = true
qrcode.workspace = true
reqwest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
