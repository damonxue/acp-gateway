[package]
name = "gateway-remote"
description = "Local HTTP API and remote WebSocket protocol for Agent Gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Embed the built web client (`web/dist`) and serve it at `/app`.
#
# Off by default so the workspace builds and tests without a JavaScript
# toolchain; the release bundle turns it on after `pnpm build`.
web-ui = ["dep:rust-embed"]

[dependencies]
gateway-ahp.workspace = true
gateway-auth.workspace = true
gateway-core.workspace = true

async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
rust-embed = { workspace = true, optional = true }
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
gateway-core = { workspace = true, features = ["testing"] }
gateway-store.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
