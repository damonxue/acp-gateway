# The macOS desktop app lives in its own cargo workspace on purpose.
#
# GPUI compiles Metal shaders at build time, which requires a full Xcode
# install. Making `app/` a member of the root workspace would mean
# `cargo test --workspace` starts building GPUI — and fails on any machine with
# only the Command Line Tools. Cargo has no optional members, so the root
# manifest excludes this directory and the app carries its own workspace.
[workspace]

[package]
name = "agent-gateway-app"
description = "macOS desktop app for Agent Gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[[bin]]
name = "agent-gateway-app"
path = "src/main.rs"

[dependencies]
gateway-core = { path = "../crates/gateway-core" }
gateway-config = { path = "../crates/gateway-config" }
gateway-auth = { path = "../crates/gateway-auth" }
gateway-remote = { path = "../crates/gateway-remote" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
futures = "0.3"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
jsonc-parser = { version = "0.33", features = ["cst", "serde", "serde_json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
