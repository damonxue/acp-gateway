# The macOS menu bar helper is a separate workspace so the root test suite does
# not require Apple's AppKit SDK or a full Xcode installation.
[workspace]

[package]
name = "agent-gateway-app"
description = "Agent Gateway macOS menu bar helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[[bin]]
name = "agent-gateway-app"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[dependencies]
gateway-cli = { path = "../crates/gateway-cli" }
gateway-config = { path = "../crates/gateway-config" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Proc-macros and build scripts are loaded as dynamic libraries while Cargo
# compiles the app. Keeping their LINKEDIT sections intact avoids Apple's
# "mis-aligned LINKEDIT string pool" loader failure on recent Xcode versions.
[profile.release.build-override]
strip = false
