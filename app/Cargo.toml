# The native desktop companion is a separate workspace so the root test suite
# does not require platform SDKs or a full Xcode installation.
[workspace]

[package]
name = "agent-gateway-app"
description = "Agent Gateway native desktop companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[[bin]]
name = "agent-gateway-app"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
# Use the maintained Objective-C bindings for the macOS UI.
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[target.'cfg(windows)'.dependencies]
# Official Microsoft Rust projection used by the native Windows companion.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
gateway-cli = { path = "../crates/gateway-cli" }
gateway-config = { path = "../crates/gateway-config" }
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Proc-macros and build scripts are loaded as dynamic libraries while Cargo
# compiles the app. Keeping their LINKEDIT sections intact avoids Apple's
# "mis-aligned LINKEDIT string pool" loader failure on recent Xcode versions.
[profile.release.build-override]
strip = false
